[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
; 데이터(DA)에서만 고르는 태그만 둔다. 코드가 쓰는 태그는 C++ 네이티브(예: 부착물 종류 Attachment.* = AttachmentTypes.h)
; 총 바디가 준다. 총 몸체에 직접 결합되는 전용 부품만 요구한다
+GameplayTagList=(Tag="Weapon.M4",DevComment="M4 바디")
+GameplayTagList=(Tag="Weapon.AR4",DevComment="AR4 바디")
+GameplayTagList=(Tag="Weapon.BoltRifle",DevComment="BoltRifle 바디 (볼트액션 사냥 소총)")
; 레일. 공용 장비가 요구한다
+GameplayTagList=(Tag="Weapon.Feature.Rail.Top",DevComment="윗면 레일 (조준경)")
+GameplayTagList=(Tag="Weapon.Feature.Rail.Bottom",DevComment="아래 레일 (손잡이·양각대)")
+GameplayTagList=(Tag="Weapon.Feature.Rail.Side",DevComment="옆 레일 (레이저·손전등)")
; 결합부. 그 방식의 부품이 요구한다
+GameplayTagList=(Tag="Weapon.Feature.LongMagwell",DevComment="탈착 탄창 우물 (BoltRifle 현대식 몸통, 나무 몸통은 내장 탄창)")
+GameplayTagList=(Tag="Weapon.Feature.PistolGripMount",DevComment="AR식 권총 손잡이 결합부 (M4 하부, BoltRifle M2010 총몸). M4식 손잡이가 요구한다")
; 게임플레이용. 장착 조건으로 쓰지 않는다
+GameplayTagList=(Tag="Weapon.Feature.Suppressed",DevComment="소음기 장착 (발사음·동물 AI)")
+GameplayTagList=(Tag="Weapon.Feature.Magnified",DevComment="배율 조준경 (조준 모드)")
